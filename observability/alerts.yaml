groups:
  - name: code-review-agent-alerts
    interval: 30s
    rules:
      # ─── High Error Rate ─────────────────────────────────────────────────────
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: code-review-backend
        annotations:
          summary: "High HTTP error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"
          runbook: "https://wiki.example.com/runbooks/high-error-rate"

      # ─── Agent Loop Detected ─────────────────────────────────────────────────
      - alert: AgentLoopDetected
        expr: |
          max by (pr_id) (
            increase(agent_steps_total[10m])
          ) > 15
        for: 2m
        labels:
          severity: warning
          service: code-review-agents
        annotations:
          summary: "Agent may be in a loop"
          description: "PR {{ $labels.pr_id }} has exceeded 15 agent steps in 10 minutes"
          runbook: "https://wiki.example.com/runbooks/agent-loop"

      # ─── High Latency ────────────────────────────────────────────────────────
      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, endpoint)
          ) > 30
        for: 5m
        labels:
          severity: warning
          service: code-review-backend
        annotations:
          summary: "High request latency on {{ $labels.endpoint }}"
          description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 30s)"

      # ─── PR Review Queue Growing ─────────────────────────────────────────────
      - alert: PRQueueBacklog
        expr: |
          pr_reviews_pending_total > 50
        for: 15m
        labels:
          severity: warning
          service: celery-workers
        annotations:
          summary: "PR review queue has large backlog"
          description: "{{ $value }} PRs pending review (threshold: 50)"
          action: "Scale up Celery workers"

      # ─── Worker Failures ─────────────────────────────────────────────────────
      - alert: HighCeleryTaskFailureRate
        expr: |
          (
            sum(rate(celery_task_failed_total[10m]))
            /
            sum(rate(celery_task_succeeded_total[10m]) + rate(celery_task_failed_total[10m]))
          ) > 0.1
        for: 10m
        labels:
          severity: critical
          service: celery-workers
        annotations:
          summary: "High Celery task failure rate"
          description: "Task failure rate is {{ $value | humanizePercentage }} (threshold: 10%)"

      # ─── Database Connection Issues ──────────────────────────────────────────
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          db_pool_size - db_pool_available < 2
        for: 5m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "Only {{ $value }} connections available"

      # ─── High False Positive Rate ────────────────────────────────────────────
      - alert: HighFalsePositiveRate
        expr: |
          (
            sum(increase(findings_false_positive_total[1h]))
            /
            sum(increase(findings_total[1h]))
          ) > 0.3
        for: 30m
        labels:
          severity: warning
          service: code-review-agents
        annotations:
          summary: "High finding false positive rate"
          description: "False positive rate is {{ $value | humanizePercentage }} (threshold: 30%)"
          action: "Review agent prompts and confidence thresholds"

      # ─── Kafka Consumer Lag ──────────────────────────────────────────────────
      - alert: KafkaConsumerLagHigh
        expr: |
          kafka_consumergroup_lag > 100
        for: 10m
        labels:
          severity: warning
          service: kafka-consumer
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer lag is {{ $value }} messages behind"

      # ─── Memory Usage ────────────────────────────────────────────────────────
      - alert: PodHighMemoryUsage
        expr: |
          (
            container_memory_working_set_bytes{namespace="code-review"}
            /
            container_spec_memory_limit_bytes{namespace="code-review"}
          ) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} high memory usage"
          description: "Memory usage at {{ $value | humanizePercentage }}"
